opt_VIVA:
  optimizer: 'Adam'
  scheduler: 'MultiStepLR'
  n_Epoch: [40]
  scheduler_args: {milestones: [25], gamma: 0.1}
  kernel_name: "MaternKernel"
  kernel_parms: {"nu": 0.5}
  noX:
    kernel_vars_init: {"lengthscale": [0.25, 1.00]}
    noise_y_init: 0.01
    scale_f_init: 1.0
    df_student_init: 2.0
    train_prior: False
    train_lk: False
  withX:
    kernel_vars_init: {"lengthscale": [0.25, 1.00]}
    noise_y_init: 0.01
    scale_f_init: 1.0
    df_student_init: 2.0
    train_prior: False
    train_lk: False
  real:
    kernel_vars_init: {"lengthscale": [0.1, 0.5]}
    noise_y_init: 1
    scale_f_init: 1.0
    df_student_init: 2.0
    train_prior: True
    train_lk: True
    n_Epoch: [40]
  smoothness: 0.5
  use_ic0: True
  batsz: 256
  timing: True
  verbose: True
  rho_list: [1.5]
